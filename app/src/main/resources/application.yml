spring:
  application:
    name: ejr-manage-kitchen
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ejr_kitchen}
    username: ${DB_USER:ejr}
    password: ${DB_PASSWORD:ejr}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma est géré par Flyway uniquement
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true     # tolère les migrations de plusieurs branches fusionnées dans le désordre
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-ejr-managekitchen-change-me-0123456789}
    expiration-minutes: 120
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8080}
  stubs:
    # true : catalogue de plats et stock simulés tant que le module supply chain (Dev 1) n'est pas prêt
    supplychain: true
  notifications:
    email:
      # log : e-mail écrit dans les logs (par défaut, tests et développement) ; smtp : envoi réel
      mode: ${EMAIL_MODE:log}
      from: ${MAIL_FROM:no-reply@ejr-managekitchen.local}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
