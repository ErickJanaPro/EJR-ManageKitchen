spring:
  application:
    name: ejr-manage-kitchen
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ejr_kitchen}
    username: ${DB_USER:ejr}
    password: ${DB_PASSWORD:ejr}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma est géré uniquement par Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
