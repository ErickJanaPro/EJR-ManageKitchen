# Base de données de développement : docker compose up -d
services:
  db:
    image: postgres:16
    container_name: ejr-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ejr_kitchen}
      POSTGRES_USER: ${DB_USER:-ejr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ejr}
    ports:
      - "5432:5432"
    volumes:
      - ejr-pgdata:/var/lib/postgresql/data

  # Serveur d'e-mails de développement : reçoit les e-mails envoyés en mode smtp
  # Interface web : http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ejr-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interface web

volumes:
  ejr-pgdata:
